worker_processes auto;
events { worker_connections 20000; }

http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;

    # Docker's embedded DNS returns one A record per scaled replica.
    # Using a variable makes nginx re-resolve, so `--scale server=N` takes effect without a restart.
    resolver 127.0.0.11 valid=2s ipv6=off;
    set $backend http://server:8080;

    location / {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;   # long-lived WebSockets
      proxy_send_timeout 1h;
      proxy_buffering off;
      proxy_next_upstream error timeout http_502;
    }
  }
}
