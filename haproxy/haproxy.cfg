global
  maxconn 50000

defaults
  mode http
  timeout connect 5s
  timeout client  1h       # long-lived WebSockets
  timeout server  1h
  timeout tunnel  1h
  option forwardfor
  option redispatch        # if a server is down, retry the connect on another
  retries 3

# Docker's embedded DNS returns one A record per scaled replica; HAProxy re-resolves it continuously,
# so `docker compose up --scale server=N` takes effect without a restart.
resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  hold valid 1s
  timeout resolve 1s
  timeout retry 1s
  resolve_retries 3

frontend web
  bind :80
  default_backend servers

backend servers
  # leastconn matters here: it sends (re)connecting clients to the emptiest server, which is what makes
  # the app's connection rebalancing work. Round-robin would ignore existing load.
  balance leastconn
  option httpchk
  http-check send meth GET uri /healthz
  default-server check inter 2s fall 2 rise 1
  server-template srv 1-30 server:8080 resolvers docker init-addr none

# HAProxy's own dashboard: http://localhost:8404
frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
