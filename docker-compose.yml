# Redis high availability: 1 primary + 2 replicas, supervised by 3 Sentinels (quorum 2).
# Sentinels elect a new primary if the current one dies; the app discovers the primary through the Sentinels.
# The Redis nodes have FIXED IPs and are referred to by IP everywhere (Sentinel, replicaof): StackExchange.Redis treats
# "redis-1:6379" and "172.x.x.x:6379" as two different servers, which makes the backplane deliver every message twice.
x-redis-node: &redis-node
  image: redis:7-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 3s
    timeout: 2s
    retries: 10
  restart: unless-stopped

x-sentinel: &sentinel
  image: redis:7-alpine
  restart: unless-stopped
  depends_on:
    redis-1: { condition: service_healthy }

networks:
  default:
    ipam:
      config: [{ subnet: 172.30.77.0/24 }]

x-redpanda: &redpanda
  image: redpandadata/redpanda:v25.3.18
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

services:
  redis-1:
    <<: *redis-node
    command: ["redis-server", "--appendonly", "no"]
    networks: { default: { ipv4_address: 172.30.77.11 } }
  redis-2:
    <<: *redis-node
    command: ["redis-server", "--appendonly", "no", "--replicaof", "172.30.77.11", "6379"]
    networks: { default: { ipv4_address: 172.30.77.12 } }
  redis-3:
    <<: *redis-node
    command: ["redis-server", "--appendonly", "no", "--replicaof", "172.30.77.11", "6379"]
    networks: { default: { ipv4_address: 172.30.77.13 } }

  sentinel-1:
    <<: *sentinel
    command: &sentinel-cmd >
      sh -c 'printf "port 26379\nsentinel resolve-hostnames yes\nsentinel monitor mymaster 172.30.77.11 6379 2\nsentinel down-after-milliseconds mymaster 3000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n" > /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf'
  sentinel-2:
    <<: *sentinel
    command: *sentinel-cmd
  sentinel-3:
    <<: *sentinel
    command: *sentinel-cmd

  # ---- Replicated message log: 3 Redpanda brokers (Raft). No --mode dev-container: that mode skips fsync. ----
  redpanda-1:
    <<: *redpanda
    command: [redpanda, start, --smp=1, --memory=768M, --reserve-memory=0M, --overprovisioned, --check=false, --default-log-level=warn,
      --node-id=1, --seeds=redpanda-1:33145, --rpc-addr=redpanda-1:33145, --advertise-rpc-addr=redpanda-1:33145,
      --kafka-addr=0.0.0.0:9092, --advertise-kafka-addr=redpanda-1:9092]
    volumes: ["redpanda-1:/var/lib/redpanda/data"]
    networks: { default: { ipv4_address: 172.30.77.21 } }   # fixed: a restarted broker must come back on the same address
  redpanda-2:
    <<: *redpanda
    command: [redpanda, start, --smp=1, --memory=768M, --reserve-memory=0M, --overprovisioned, --check=false, --default-log-level=warn,
      --node-id=2, --seeds=redpanda-1:33145, --rpc-addr=redpanda-2:33145, --advertise-rpc-addr=redpanda-2:33145,
      --kafka-addr=0.0.0.0:9092, --advertise-kafka-addr=redpanda-2:9092]
    volumes: ["redpanda-2:/var/lib/redpanda/data"]
    networks: { default: { ipv4_address: 172.30.77.22 } }   # fixed: a restarted broker must come back on the same address
  redpanda-3:
    <<: *redpanda
    command: [redpanda, start, --smp=1, --memory=768M, --reserve-memory=0M, --overprovisioned, --check=false, --default-log-level=warn,
      --node-id=3, --seeds=redpanda-1:33145, --rpc-addr=redpanda-3:33145, --advertise-rpc-addr=redpanda-3:33145,
      --kafka-addr=0.0.0.0:9092, --advertise-kafka-addr=redpanda-3:9092]
    volumes: ["redpanda-3:/var/lib/redpanda/data"]
    networks: { default: { ipv4_address: 172.30.77.23 } }   # fixed: a restarted broker must come back on the same address

  redpanda-init:         # idempotent: creates the topic once, then exits
    image: redpandadata/redpanda:v25.3.18
    restart: "no"
    depends_on:
      redpanda-1: { condition: service_healthy }
      redpanda-2: { condition: service_healthy }
      redpanda-3: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic describe chat.messages -X brokers=redpanda-1:9092 >/dev/null 2>&1 ||
        rpk topic create chat.messages -X brokers=redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
        -p 12 -r 3 -c min.insync.replicas=2 -c retention.ms=86400000 -c segment.bytes=134217728

  redpanda-console:      # http://localhost:8082 : browse brokers, partitions and messages
    image: redpandadata/console:v2.8.17
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
    ports: ["8082:8080"]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }

  server:                # scale with: docker compose up -d --scale server=N
    build: ./src/ChatServer
    environment:
      Redis__Sentinels: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      Redis__ServiceName: mymaster
      Kafka__Bootstrap: redpanda-1:9092,redpanda-2:9092,redpanda-3:9092
    volumes: ["./src/ChatServer/devices.json:/app/devices.json:ro"]   # friendly device names, editable live
    depends_on:
      sentinel-1: { condition: service_started }
      sentinel-2: { condition: service_started }
      sentinel-3: { condition: service_started }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s   # graceful drain on SIGTERM (docker stop / rolling restart) needs time
    deploy:
      replicas: 3

  loadbalancer:          # YARP reverse proxy + load balancer (src/Gateway)
    build: ./src/Gateway
    environment:
      UPSTREAM_HOST: server
      UPSTREAM_PORT: 8080
    ports: ["9000:80", "8404:8404"]   # app, gateway status page
    depends_on: [server]
    restart: unless-stopped

  loadtest:              # run on demand: docker compose run --no-deps --rm loadtest
    build: ./src/LoadTest
    profiles: ["loadtest"]
    environment:
      TARGET_URL: http://loadbalancer/chat
      CONNECTIONS: 500
      SENDERS: 5
      MSGS_PER_SEC: 5
      DURATION_SEC: 30
    depends_on: [loadbalancer]

# Persistent data lives in volumes created OUTSIDE compose (scripts/volumes.sh), so nothing compose does can delete it.
volumes:
  redpanda-1: { external: true, name: signalr-redpanda-1 }
  redpanda-2: { external: true, name: signalr-redpanda-2 }
  redpanda-3: { external: true, name: signalr-redpanda-3 }
