services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  server:                # scale with: docker compose up -d --scale server=N
    build: ./src/ChatServer
    environment:
      ConnectionStrings__Redis: redis:6379
    volumes: ["./src/ChatServer/devices.json:/app/devices.json:ro"]   # friendly device names, editable live
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      replicas: 3

  loadbalancer:
    image: haproxy:lts-alpine
    ports: ["9000:80", "8404:8404"]   # app, HAProxy stats dashboard
    volumes: ["./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: [server]

  loadtest:              # run on demand: docker compose run --rm loadtest
    build: ./src/LoadTest
    profiles: ["loadtest"]
    environment:
      TARGET_URL: http://loadbalancer/chat
      CONNECTIONS: 500
      SENDERS: 5
      MSGS_PER_SEC: 5
      DURATION_SEC: 30
    depends_on: [loadbalancer]
